# ================================================================
#  docker-compose.dev.yml — Override para desarrollo local
#  Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
#  Diferencias respecto al compose base:
#    - Backend en modo --reload (hot-reload automático)
#    - Frontend servido por Vite dev server (puerto 5173) con HMR
#    - Expone el puerto de la DB para herramientas externas (DBeaver, etc.)
# ================================================================

services:

  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://alcatraz_user:alcatraz_pass@db:5432/alcatraz
      REDIS_URL: redis://redis:6379/0

  frontend:
    # En dev usamos Vite directamente para Hot Module Replacement
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules              # Evita sobreescribir node_modules del contenedor
    environment:
      VITE_API_URL: http://localhost:8000/api

  db:
    ports:
      - "5432:5432"                    # Expuesto para herramientas como DBeaver
